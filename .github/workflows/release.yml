name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build extension zip
        run: |
          mkdir -p dist
          zip -r "dist/twitch-adblock-${GITHUB_REF_NAME#v}.zip" \
            manifest.json content.js bridge.js \
            popup.html popup.css popup.js \
            icons _locales \
            LICENSE README.md README.ru.md CHANGELOG.md

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
